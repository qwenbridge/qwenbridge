services:
  ollama:
    image: ollama/ollama:latest
    container_name: omnisearch-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  omnisearch-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnisearch-ai
    ports:
      - "8080:8080"
    environment:
      OMNISEARCH_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama-data:
