services:

  ollama:
    image: ollama/ollama:latest
    container_name: qwenbridge-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20

  qwenbridge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: qwenbridge

    depends_on:
      ollama:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      QWENBRIDGE_AI_PROVIDER: ollama
      QWENBRIDGE_OLLAMA_BASE_URL: http://ollama:11434

volumes:
  ollama-data: