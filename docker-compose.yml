services:
  qwenbridge-ollama:
    image: ollama/ollama:latest
    container_name: qwenbridge-ollama
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  qwenbridge-ollama-init:
    image: ollama/ollama:latest
    container_name: qwenbridge-ollama-init
    depends_on:
      qwenbridge-ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://qwenbridge-ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull qwen2.5 &&
       ollama pull bge-m3 &&
       ollama list"
    restart: "no"

  qwenbridge-redis:
    image: redis:7.2-alpine
    container_name: qwenbridge-redis
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  qwenbridge-opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: qwenbridge-opensearch
    restart: unless-stopped
    mem_limit: 1g
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  qwenbridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwenbridge-app
    restart: unless-stopped
    depends_on:
      qwenbridge-ollama-init:
        condition: service_completed_successfully
      qwenbridge-redis:
        condition: service_healthy
      qwenbridge-opensearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-"-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"}
      QWENBRIDGE_AI_PROVIDER: ollama
      QWENBRIDGE_AI_OLLAMA_BASE_URL: http://qwenbridge-ollama:11434
      QWENBRIDGE_AI_OLLAMA_CHAT_MODEL: qwen2.5
      QWENBRIDGE_AI_OLLAMA_EMBEDDING_MODEL: bge-m3
      QWENBRIDGE_SEARCH_OPENSEARCH_BASE_URL: http://qwenbridge-opensearch:9200
      QWENBRIDGE_ANALYSIS_CACHE_REDIS_HOST: qwenbridge-redis
      QWENBRIDGE_ANALYSIS_CACHE_REDIS_PORT: 6379
      QWENBRIDGE_ANALYSIS_CACHE_ANALYSIS_TIMEOUT: 10s
    profiles: ["production"]
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    labels:
      org.opencontainers.image.title: "QwenBridge"
      org.opencontainers.image.version: "0.8.1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ollama-data:
  opensearch-data:
