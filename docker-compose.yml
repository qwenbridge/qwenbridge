services:
  ollama:
    image: ollama/ollama:latest
    container_name: qwenbridge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  qwenbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwenbridge
    ports:
      - "8080:8080"
    environment:
      QWENBRIDGE_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama-data:
