services:

  ollama:
    image: ollama/ollama:latest
    container_name: qwenbridge-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20

  qwenbridge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: qwenbridge

    depends_on:
      ollama:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      QWENBRIDGE_AI_PROVIDER: ollama
      QWENBRIDGE_AI_OLLAMA_BASE_URL: http://ollama:11434
      QWENBRIDGE_SEARCH_OPENSEARCH_BASE_URL: http://opensearch:9200
      QWENBRIDGE_ANALYSIS_CACHE_REDIS_HOST: redis
      QWENBRIDGE_ANALYSIS_CACHE_REDIS_PORT: 6379

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: qwenbridge-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    container_name: qwenbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  ollama-data:
