<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QwenBridge Developer Playground</title><link rel="stylesheet" href="playground.css"><script type="module" src="playground.js"></script></head>
<body><main><h1>QwenBridge Developer Playground</h1><p>Inspect a natural-language search and its execution evidence. Everything shown is the server's recorded response; nothing is reconstructed in the page.</p>
<form id="connection"><label>API URL <input name="base" type="url" required></label><label>Bearer credential <input name="token" type="password" autocomplete="off" spellcheck="false"></label><label>Transport <select name="transport"><option value="rest">REST</option><option value="sse">SSE</option></select></label><label>Mode <select name="mode"><option value="session">Session (consent for alternatives)</option><option value="search">Single search</option></select></label><label>Contract <select name="contract"><option value="">apiVersion 2 (client strategy)</option><option value="commerce-search/1.0">commerce-search/1.0 (planned)</option></select></label><label>Backend <select name="backend"><option value="">Server default</option></select></label><button>Connect</button></form><p id="connection-status" role="status"></p>
<qwenbridge-search></qwenbridge-search><p id="debug-status" role="status"></p><div id="inspection" aria-live="polite"></div>
</main></body></html>
