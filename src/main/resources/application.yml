spring:
  application:
    name: qwenbridge

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

qwenbridge:
  ai:
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      chat-model: qwen2.5
      embedding-model: bge-m3
      connect-timeout: 5s
      read-timeout: 60s

  search:
    opensearch:
      default-size: 10
      base-url: http://localhost:9200
      index: qwenbridge-products
      connect-timeout: 5s
      read-timeout: 30s

  analysis:
    cache:
      enabled: true
      type: redis
      key-prefix: qwenbridge:analysis
      provider: ollama
      model: qwen2.5
      version: v4
      ttl: 10m
      redis:
        host: localhost
        port: 6379
        connect-timeout: 2s
        command-timeout: 2s

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger
