spring:
  application:
    name: qwenbridge

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

qwenbridge:
  ai:
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      chat-model: qwen2.5
      embedding-model: bge-m3
      connect-timeout: 5s
      read-timeout: 60s
