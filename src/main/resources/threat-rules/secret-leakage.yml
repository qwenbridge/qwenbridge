rules:
  - id: secret-aws-access-key
    regex: "\\bAKIA[0-9A-Z]{16}\\b"
    severity: CRITICAL
    score: 0.98
    confidence: 0.96
    evidence: "AWS access key"
    reason: "AWS access key pattern detected."

  - id: secret-github-token
    regex: "\\bgh[pousr]_[A-Za-z0-9_]{20,}\\b"
    severity: CRITICAL
    score: 0.96
    confidence: 0.94
    evidence: "GitHub token"
    reason: "GitHub token pattern detected."

  - id: secret-private-key
    regex: "-----BEGIN\\s+(RSA|EC|DSA|OPENSSH)?\\s*PRIVATE\\s+KEY-----"
    severity: CRITICAL
    score: 1.00
    confidence: 0.98
    evidence: "private key block"
    reason: "Private key material detected."

  - id: secret-generic-api-key
    regex: "(?i)\\b(api[_-]?key|secret|token|password)\\s*[:=]\\s*['\"]?[A-Za-z0-9_\\-]{16,}"
    severity: HIGH
    score: 0.82
    confidence: 0.84
    evidence: "generic secret assignment"
    reason: "Generic secret assignment pattern detected."
