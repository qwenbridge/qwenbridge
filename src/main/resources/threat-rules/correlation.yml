rules:
  - id: prompt-plus-jailbreak
    when:
      allOf:
        - PROMPT_INJECTION
        - JAILBREAK
    scoreBoost: 0.18
    riskLevel: CRITICAL
    reason: "Prompt injection combined with jailbreak behavior."

  - id: sql-plus-unicode-obfuscation
    when:
      allOf:
        - SQL_INJECTION
        - UNICODE_OBFUSCATION
    scoreBoost: 0.16
    riskLevel: HIGH
    reason: "SQL injection combined with Unicode obfuscation."

  - id: xss-plus-unicode-obfuscation
    when:
      allOf:
        - XSS
        - UNICODE_OBFUSCATION
    scoreBoost: 0.14
    riskLevel: HIGH
    reason: "XSS combined with Unicode obfuscation."

  - id: command-plus-path-traversal
    when:
      allOf:
        - COMMAND_INJECTION
        - PATH_TRAVERSAL
    scoreBoost: 0.20
    riskLevel: CRITICAL
    reason: "Command injection combined with path traversal."

  - id: prompt-plus-secret-leakage
    when:
      allOf:
        - PROMPT_INJECTION
        - SECRET_LEAKAGE
    scoreBoost: 0.20
    riskLevel: CRITICAL
    reason: "Prompt injection combined with secret leakage."

  - id: ssrf-plus-secret-leakage
    when:
      allOf:
        - SSRF
        - SECRET_LEAKAGE
    scoreBoost: 0.18
    riskLevel: CRITICAL
    reason: "SSRF combined with secret exposure."
