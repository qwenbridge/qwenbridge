name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Punit-tests test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Pintegration-tests test

  architecture-test:
    name: Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -pl qwenbridge-server -Dtest=ArchitectureRulesTest test

  api-compatibility:
    name: API Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Verify API compatibility tests
        run: mvn -B -pl qwenbridge-server -Dtest=ApiVersionControllerTest,ApiHealthControllerTest test

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Restore Dependency-Check data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-v2
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      - name: Generate dependency vulnerability report
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B org.owasp:dependency-check-maven:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DfailBuildOnCVSS=11
          -Dformat=HTML

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f qwenbridge-server/Dockerfile -t qwenbridge:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: qwenbridge:${{ github.sha }}
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          ignorefile: .trivyignore

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-container-scan-report
          path: trivy-results.txt
          retention-days: 30

  benchmark-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -pl qwenbridge-server -Dtest=DefaultBenchmarkEvaluationRunnerTest test

  docker-release-verification:
    name: Docker Release Verification
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, architecture-test, api-compatibility]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f qwenbridge-server/Dockerfile -t qwenbridge:ci .
      - name: Verify image metadata
        run: docker image inspect qwenbridge:ci >/tmp/qwenbridge-image.json
      - uses: actions/upload-artifact@v7
        with:
          name: docker-release-evidence
          path: /tmp/qwenbridge-image.json
          retention-days: 30
