name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read
  security-events: write

env:
  # Maven Central occasionally answers 502/504; by default Maven retries only 429 and 503, so a
  # single bad gateway failed a whole job. Retry transient answers up to 5 times, 5 s apart.
  MAVEN_ARGS: >-
    -Daether.transport.http.retryHandler.count=5
    -Daether.transport.http.retryHandler.interval=5000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504

jobs:
  analyze:
    name: CodeQL Analyze
    if: ${{ github.event.repository.private == false || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin

      - name: Build
        run: mvn -B -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
