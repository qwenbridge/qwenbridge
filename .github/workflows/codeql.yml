name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read
  security-events: write

env:
  # Maven Central occasionally answers 502/504; by default Maven retries only 429 and 503, so a
  # single bad gateway failed a whole job. Retry transient answers up to 5 times, 5 s apart.
  MAVEN_ARGS: >-
    -Daether.transport.http.retryHandler.count=5
    -Daether.transport.http.retryHandler.interval=5000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504

jobs:
  analyze:
    name: CodeQL Analyze
    if: ${{ github.event.repository.private == false || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: java-kotlin

      - name: Build
        run: mvn -B -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
