name: Master Verification

# Runs the complete QwenBridge master verification, scripts/qwenbridge-final-verification.sh: the
# same script used for every 1.0 task. It starts the local Docker Compose stack (Ollama with the
# qwen2.5 and bge-m3 models, Redis, the optional OpenSearch profile and the packaged application)
# and runs the full reactor with live integrations, code quality, the release, API and SSE
# checks, the runtime steps (database-free runtime, multilingual expansion, Quarkus-only), the
# dual-SDK end-to-end suite and the k6 workloads with a shortened load.
#
# The V9 load test (cold and cached k6 phases) is off by default: on a shared CPU-only runner it
# measures the runner, not QwenBridge, and the small model occasionally returns no analysis under
# load. Run it on demand with the run_performance input, or locally (docs/development/testing.md).
#
# It needs a large runner: about 10 GB of images and models, and a CPU-only model is slow. It runs
# on demand, nightly and after every push to main; it is not a required pull-request check.

on:
  workflow_dispatch:
    inputs:
      run_performance:
        description: "Run the V9 k6 load test (slow and noisy on GitHub runners)"
        type: boolean
        default: false
      perf_total_requests:
        description: "Total k6 requests for the staged load test"
        default: "1000"
      perf_vus:
        description: "k6 virtual users"
        default: "10"
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: master-verification
  cancel-in-progress: false

env:
  # Maven Central occasionally answers 502/504; by default Maven retries only 429 and 503, so a
  # single bad gateway failed a whole job. Retry transient answers up to 5 times, 5 s apart.
  MAVEN_ARGS: >-
    -Daether.transport.http.retryHandler.count=5
    -Daether.transport.http.retryHandler.interval=5000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504

jobs:
  master:
    name: Master verification
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VERIFY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PERF_TOTAL_REQUESTS: ${{ inputs.perf_total_requests || '1000' }}
      PERF_VUS: ${{ inputs.perf_vus || '10' }}
      RUN_V9_PERFORMANCE: ${{ inputs.run_performance && 'true' || 'false' }}
      # Without the load test the application would get the default per-IP limit of 2000 requests;
      # keep the budget the earlier runs had (1000 + 40000) so the other suites are not throttled.
      QWENBRIDGE_ABUSE_PER_IP_LIMIT: "41000"
      QWENBRIDGE_ABUSE_AI_REQUEST_QUOTA: "41000"
      # GitHub runners have no GPU: qwen2.5 answers several times slower than on a developer
      # machine, so the production time limits (analysis 10 s, reranking 3 s) would fail closed.
      # These apply to the live JUnit suite and the packaged runtime steps; tests that check
      # timeout behaviour set their own values in test profiles, which take precedence.
      OLLAMA_NUM_PARALLEL: "1"
      QWENBRIDGE_AI_OLLAMA_READ_TIMEOUT: 300s
      QUARKUS_REST_CLIENT_OLLAMA_READ_TIMEOUT: "300000"
      QWENBRIDGE_ANALYSIS_CACHE_ANALYSIS_TIMEOUT: 180s
      # The reranker accepts at most 30 000 ms.
      QWENBRIDGE_COMMERCE_RERANK_TIMEOUT_MS: "30000"
      QWENBRIDGE_EMBEDDING_TIMEOUT: 120s
      QWENBRIDGE_MULTILINGUAL_TIMEOUT: 300s
      QWENBRIDGE_MULTILINGUAL_PER_LANGUAGE_TIMEOUT: 180s
      # Analysis streams the model answer and gives up when no token arrives within this time
      # (30 s by default). On CPU the prompt alone takes about 30 s before the first token, so the
      # request fell back to the fail-closed answer (BLOCK, no model analysis).
      QWENBRIDGE_STREAMING_MAX_AI_STREAM_DURATION: 180s
      # The test HTTP client gives up after 30 s by default; the first model call (loading the
      # model into memory on CPU) can take longer.
      QUARKUS_HTTP_TEST_TIMEOUT: 300s
      # Latency depends on the machine. The approved latency baselines (evaluation/baselines) were
      # measured on an 8-CPU developer machine; on this 4-CPU shared runner they are reported, not
      # gated. Quality and error gates still apply. Scenario J injects a 50 ms delay, larger than the
      # runner's own keyword p95 (10-15 ms) and its noise, and compares it with the same run.
      QWENBRIDGE_PERF_HARDWARE: github-hosted-4cpu
      QWENBRIDGE_BENCHMARK_INJECTED_DELAY_MS: "50"
      # Each cold request runs qwen2.5 on the CPU (about 30 s); the 5 s / 15 s limits are for a
      # machine with a GPU or Apple silicon. Cached phases keep the default limits.
      PERF_COLD_P95_MS: "60000"
      PERF_COLD_P99_MS: "90000"
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system df
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qwenbridge-typescript-sdk/package-lock.json
      - name: Local environment file
        # The Compose stack reads .env; the template holds no credentials. The Docker application
        # gets the same CPU-runner time limits as the job.
        run: |
          cp .env.example .env
          for name in QWENBRIDGE_AI_OLLAMA_READ_TIMEOUT QUARKUS_REST_CLIENT_OLLAMA_READ_TIMEOUT \
            QWENBRIDGE_ANALYSIS_CACHE_ANALYSIS_TIMEOUT QWENBRIDGE_COMMERCE_RERANK_TIMEOUT_MS \
            QWENBRIDGE_EMBEDDING_TIMEOUT QWENBRIDGE_MULTILINGUAL_TIMEOUT \
            QWENBRIDGE_MULTILINGUAL_PER_LANGUAGE_TIMEOUT QWENBRIDGE_STREAMING_MAX_AI_STREAM_DURATION; do
            sed -i "/^${name}=/d" .env
            echo "${name}=${!name}" >> .env
          done
      - name: TypeScript SDK dependencies and Chromium for the Web Component checks
        run: |
          npm --prefix qwenbridge-typescript-sdk ci
          npm --prefix qwenbridge-typescript-sdk exec -- playwright install --with-deps chromium
      # The script builds the application image with Docker Compose. Compose uses this Buildx
      # builder, whose layers come from the GitHub Actions cache shared with CI (scope
      # qwenbridge-image), so the Maven dependency layer is not downloaded again on every run.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - name: Application image name
        # The name Compose gives the built qwenbridge-app image (<project>-qwenbridge-app).
        id: appimage
        run: |
          name="$(docker compose --profile production --profile opensearch config --images | grep -- '-qwenbridge-app$')"
          test -n "${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Build the application image from the layer cache
        # Compose's own build cannot read the GitHub Actions cache and downloaded every Maven
        # dependency again (about 1,800 files). This build uses the cache and loads the image under
        # the Compose name; the verification starts it with APP_IMAGE_PREBUILT=true.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: qwenbridge-server/Dockerfile
          load: true
          tags: ${{ steps.appimage.outputs.name }}
          cache-from: type=gha,scope=qwenbridge-image
          cache-to: type=gha,scope=qwenbridge-image,mode=max
      - name: Master verification
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          APP_IMAGE_PREBUILT: "true"
        run: bash scripts/qwenbridge-final-verification.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p master-evidence
          cp -R logs master-evidence/ 2>/dev/null || true
          docker compose ps > master-evidence/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > master-evidence/compose.log 2>&1 || true
          # TLS material generated for the secure OpenSearch checks: keep certificates, drop keys.
          find master-evidence -name '*key*.pem' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: master-verification-${{ github.run_id }}
          path: master-evidence
          retention-days: 30
