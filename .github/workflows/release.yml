name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  security-events: write

env:
  # Maven Central occasionally answers 502/504; by default Maven retries only 429 and 503, so a
  # single bad gateway failed a whole job. Retry transient answers up to 5 times, 5 s apart.
  MAVEN_ARGS: >-
    -Daether.transport.http.retryHandler.count=5
    -Daether.transport.http.retryHandler.interval=5000
    -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504

jobs:
  release-verification:
    name: Release Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Build Docker image
        run: docker build -f qwenbridge-server/Dockerfile -t qwenbridge:${{ github.ref_name }} .
      - name: Verify release script
        env:
          RELEASE_LIGHTWEIGHT: "true"
          RUN_DOCKER_RUNTIME: "false"
          RUN_V8_RUNTIME_VALIDATIONS: "false"
          RUN_V9_RUNTIME_SDK_TESTS: "false"
          RUN_V9_PERFORMANCE: "false"
          PULL_DOCKER_IMAGES: "false"
        run: bash scripts/verify-release.sh
      - name: Collect release evidence
        run: |
          mkdir -p release-evidence
          cp -R docs/release release-evidence/docs-release
          docker image inspect qwenbridge:${{ github.ref_name }} > release-evidence/docker-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qwenbridge-release-evidence-${{ github.ref_name }}
          path: release-evidence
          retention-days: 90
