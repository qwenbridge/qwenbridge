name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  security-events: write

jobs:
  release-verification:
    name: Release Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Build Docker image
        run: docker build -f qwenbridge-server/Dockerfile -t qwenbridge:${{ github.ref_name }} .
      - name: Verify release script
        env:
          RELEASE_LIGHTWEIGHT: "true"
          RUN_DOCKER_RUNTIME: "false"
          RUN_V8_RUNTIME_VALIDATIONS: "false"
          RUN_V9_RUNTIME_SDK_TESTS: "false"
          RUN_V9_PERFORMANCE: "false"
          PULL_DOCKER_IMAGES: "false"
        run: bash scripts/verify-release.sh
      - name: Collect release evidence
        run: |
          mkdir -p release-evidence
          cp -R docs/release release-evidence/docs-release
          docker image inspect qwenbridge:${{ github.ref_name }} > release-evidence/docker-image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qwenbridge-release-evidence-${{ github.ref_name }}
          path: release-evidence
          retention-days: 90
