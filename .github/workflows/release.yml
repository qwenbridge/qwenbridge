name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn clean test

      - name: Build package
        run: mvn clean package -DskipTests
